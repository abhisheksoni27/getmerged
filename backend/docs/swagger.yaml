basePath: /
definitions:
  handler.HealthResponse:
    properties:
      cache:
        type: string
      commit:
        type: string
      database:
        type: string
      status:
        type: string
      timestamp:
        type: string
      uptime:
        type: string
    type: object
  handler.ScoreRepoBody:
    properties:
      name:
        type: string
      owner:
        type: string
    required:
    - name
    - owner
    type: object
  handler.SeedBody:
    properties:
      force:
        type: boolean
      languages:
        items:
          type: string
        type: array
    type: object
  handler.StartScanBody:
    properties:
      force:
        type: boolean
      repo:
        type: string
      url:
        type: string
    type: object
  notification.CRankAlertSummary:
    properties:
      alerts_found:
        type: integer
      baselined:
        type: integer
      dead_lettered:
        type: integer
      emails_failed:
        type: integer
      emails_sent:
        type: integer
      queued:
        type: integer
      retrying:
        type: integer
      unsubscribed_skipped:
        type: integer
      watchers_considered:
        type: integer
    type: object
  notification.WeeklyDigestSummary:
    properties:
      alerts_found:
        type: integer
      emails_failed:
        type: integer
      emails_sent:
        type: integer
      failed:
        type: integer
      sent:
        type: integer
      skipped_new:
        type: integer
      status:
        type: string
      users_considered:
        type: integer
      webhooks_disabled:
        type: integer
      webhooks_failed:
        type: integer
      webhooks_sent:
        type: integer
      week_start:
        type: string
    type: object
host: opendoor.abhishekco.de
info:
  contact: {}
  description: Find open-source repositories that welcome contributors - ranked by
    C-Rank™.
  title: OpenDoor API
  version: "1.0"
paths:
  /api/v1/repos:
    get:
      description: Returns a paginated list of repositories with their latest C-Rank
        scores.
      parameters:
      - description: Filter by language (e.g. Go)
        in: query
        name: language
        type: string
      - description: Minimum star count
        in: query
        name: min_stars
        type: integer
      - description: Partial name search
        in: query
        name: name
        type: string
      - description: Sort column (c_rank_score, stars, time_to_first_response_hours)
        in: query
        name: sort
        type: string
      - description: Minimum C-Rank tier floor (S, A, B, C, D); keeps tiers at or
          above
        in: query
        name: min_tier
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List repositories
      tags:
      - repos
  /health:
    get:
      description: Returns service health status, uptime, database/cache connectivity,
        and deployed git commit hash.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Health Check
      tags:
      - system
  /internal/jobs/crank-change-alerts:
    post:
      description: Emails watchlist users when a watched repo crosses a C-Rank tier
        boundary or shifts by the configured delta. Synchronous.
      parameters:
      - description: Job secret
        in: header
        name: X-Job-Secret
        required: true
        type: string
      - description: Report would-be alerts without sending
        in: query
        name: dry_run
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notification.CRankAlertSummary'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Trigger C-Rank change alerts
      tags:
      - internal
  /internal/jobs/weekly-digest:
    post:
      description: Computes C-Rank changes on watched repos and emails alert digests.
        Synchronous.
      parameters:
      - description: Job secret
        in: header
        name: X-Job-Secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notification.WeeklyDigestSummary'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger weekly watchlist digest
      tags:
      - internal
  /internal/migrate-latest-snapshots:
    post:
      description: Backfills latest_snapshots table with latest record for each repo.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Migrate latest snapshots
      tags:
      - internal
  /internal/purge-cache:
    post:
      description: Flushes all Valkey cached API responses in one request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Purge API Cache
      tags:
      - internal
  /internal/repos/{id}:
    delete:
      description: Deletes a repository record and all of its daily snapshot history.
      parameters:
      - description: Repository ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete repository and snapshots
      tags:
      - internal
  /internal/score-repo:
    post:
      consumes:
      - application/json
      description: Fetches live GitHub data, computes metrics and C-Rank, and saves
        to DB.
      parameters:
      - description: Repository to score
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ScoreRepoBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Score a single repository & store to DB
      tags:
      - internal
  /internal/seed:
    post:
      consumes:
      - application/json
      description: Searches top repositories per language and runs initial C-Rank
        scoring.
      parameters:
      - description: Target languages
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.SeedBody'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Trigger database seed job
      tags:
      - internal
  /internal/sync-trending:
    post:
      description: Fetches repos trending in the last 24h from OSSInsight and marks
        them in the database.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Sync trending repos
      tags:
      - internal
  /internal/update-scores:
    post:
      description: Fetches GitHub data for stale repos and recomputes C-Rank scores.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Trigger score update
      tags:
      - internal
  /scan:
    post:
      consumes:
      - application/json
      parameters:
      - description: Repository URL or owner/repo
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.StartScanBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start an on-demand C-Rank scan for any public GitHub repo
      tags:
      - scan
  /scan/status/{owner}/{name}:
    get:
      parameters:
      - description: Repository owner
        in: path
        name: owner
        required: true
        type: string
      - description: Repository name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Poll on-demand scan progress
      tags:
      - scan
securityDefinitions:
  BearerAuth:
    description: 'Public API key auth. Create a key in your dashboard, then send:
      Authorization: Bearer odk_... Limits per key - Free: 60 req/hour + 10 req/min
      burst; Pro: 600 req/hour + 100 req/min burst. Errors: 401 code=ERR_MALFORMED_AUTH_HEADER
      or ERR_INVALID_API_KEY (invalid/revoked); 429 code=ERR_RATE_LIMITED with Retry-After
      header.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
