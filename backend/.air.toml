root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"
  delay = 1000
  exclude_dir = ["tmp", "docs"]
  include_ext = ["go", "env"]
  kill_delay = "0s"
  log = "build-errors.log"
  rerun_delay = 500
  send_interrupt = false

[log]
  time = false

[misc]
  clean_on_exit = true
