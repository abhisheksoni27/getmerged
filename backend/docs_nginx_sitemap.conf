# Nginx Configuration Snippet for Opendoor Static Sitemaps
# Place inside /etc/nginx/conf.d/opendoor.conf or /etc/nginx/sites-available/opendoor

server {
    server_name opendoor.abhishekco.de;

    # Serve master sitemap.xml and partition files directly from frontend/public directory
    location ~* ^/(sitemap\.xml|sitemap/.*\.xml)$ {
        root /opt/opendoor/frontend/public;
        types {
            application/xml xml;
        }
        expires 1h;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Proxy SVG badges (/badge/:owner/:repo.svg) to the Go backend
    location ^~ /badge/ {
        include snippets/proxy_backend.conf;
    }

    # Reverse proxy remaining requests to Next.js node application
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
